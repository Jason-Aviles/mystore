[build]
  command = "npm run build"
  publish = "dist"

# Retire the legacy www storefront while preserving paths and query strings.
[[redirects]]
  from = "https://www.darkdivine.store/*"
  to = "https://darkdivine.store/:splat"
  status = 301
  force = true

# SPA fallback — React Router owns all routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
